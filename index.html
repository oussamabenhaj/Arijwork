<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Device Info</title>
</head>
<body>
  <h3>Location</h3>
  <p>Latitude: <span id="lat">—</span></p>
  <p>Longitude: <span id="lon">—</span></p>
  <p id="locStatus"></p>

  <h3>Photo</h3>
  <img id="shot" alt="photo" style="max-width:100%;display:none;" />
  <p id="camStatus"></p>

  <video id="video" autoplay playsinline muted style="display:none;"></video>

<script>
  // ---- Location ----
  function getLocation() {
    var st = document.getElementById('locStatus');
    if (!navigator.geolocation) { st.textContent = 'Geolocation not supported.'; return; }
    st.textContent = 'Requesting location…';
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        document.getElementById('lat').textContent = pos.coords.latitude;
        document.getElementById('lon').textContent = pos.coords.longitude;
        st.textContent = '';
      },
      function (err) { st.textContent = 'Location error: ' + err.message; },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  }

  // ---- Camera + auto capture ----
  var stream = null;
  var video = document.getElementById('video');
  var shot = document.getElementById('shot');
  var camStatus = document.getElementById('camStatus');

  function capturePhoto() {
    if (!stream) return;
    var canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    shot.src = canvas.toDataURL('image/png');
    shot.style.display = 'block';
    camStatus.textContent = '';
  }

  function startCamera() {
    camStatus.textContent = 'Requesting camera…';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
      .then(function (s) {
        stream = s;
        video.srcObject = stream;
        alert('Camera access authorized');
        if (video.readyState >= 2) { setTimeout(capturePhoto, 600); }
        else { video.addEventListener('loadeddata', function () { setTimeout(capturePhoto, 600); }, { once: true }); }
      })
      .catch(function (e) { camStatus.textContent = 'Camera error: ' + e.message; });
  }

  // ---- Run on load ----
  window.addEventListener('load', function () {
    getLocation();
    setTimeout(startCamera, 400);
  });
</script>
</body>
</html>
